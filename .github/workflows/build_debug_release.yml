name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Choose what to build
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

  push:
    tags:
      - 'v*'   # automatic release build on version tags like v1.0.0

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Fix gradlew and permissions
        working-directory: ./Ventoid
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename debug APK
        id: rename
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          DEBUG_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          DEBUG_DST="Ventoid-${TAG}-debug.apk"
          cp "$DEBUG_SRC" "$DEBUG_DST"
          echo "debug_apk=$DEBUG_DST" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.debug_apk }}
          path: ${{ steps.rename.outputs.debug_apk }}

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Fix gradlew and permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build release APK (signed)
        env:
          VENTOID_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          VENTOID_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          VENTOID_RELEASE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          VENTOID_RELEASE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename release APK
        id: rename
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          RELEASE_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          RELEASE_DST="Ventoid-${TAG}-release.apk"
          cp "$RELEASE_SRC" "$RELEASE_DST"
          echo "release_apk=$RELEASE_DST" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.release_apk }}
          path: ${{ steps.rename.outputs.release_apk }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename.outputs.tag }}
          name: "Ventoid ${{ steps.rename.outputs.tag }}"
          draft: false
          prerelease: ${{ contains(steps.rename.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            ${{ steps.rename.outputs.release_apk }}
