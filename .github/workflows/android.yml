name: Build Ventoid Debug

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Gradle task to run
        required: true
        default: assembleDebug
  push:
    branches: [main, master, update-gui]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: core/app   # 👈 adjust to where gradlew lives

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew ${{ github.event.inputs.build_type }} --stacktrace --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Ventoid-${{ github.event.inputs.build_type }}
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
